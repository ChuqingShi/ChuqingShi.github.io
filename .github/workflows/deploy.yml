# Build the site and publish it to GitHub Pages.
#
# What triggers it:
#   - a pull request: runs every check and builds, but does NOT publish
#   - a push (or merge) to main: runs every check, builds, and publishes
#   - "Run workflow" on the Actions tab: same as a push to main
#
# One-time setup before the first publish (needs Chuqing):
#   GitHub repo -> Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions"
# See learning/07-deployment.md.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The minimum permissions publishing needs. Nothing here can push code.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, finish one publish before starting the next.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the versions in package-lock.json.
      - run: npm ci

      # Lint, typecheck, unit tests and production build. Any failure stops here.
      - run: npm run check

      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only publish from main, never from a pull request.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
